services:
  # 1. 웹 서버 (FastAPI)
  - type: web
    name: brandie-web
    env: python
    # backend 폴더가 루트이므로 올바른 경로를 지정합니다.
    rootDir: backend
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'uvicorn main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: brandie-redis # <-- Render에서 만드신 Redis 이름
          property: internalUrl

  # 2. 워커 (Celery)
  - type: worker
    name: brandie-worker
    env: python
    rootDir: backend
    buildCommand: 'pip install -r requirements.txt'
    startCommand: 'celery -A celery_worker worker --loglevel=info'
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: brandie-redis # <-- Render에서 만드신 Redis 이름
          property: internalUrl
