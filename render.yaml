services:
  # 1. 웹 서버 (FastAPI)
  - type: web
    name: brandie-web
    env: python
    buildCommand: 'pip install -r backend/requirements.txt'
    startCommand: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker --timeout 240 backend.main:app'
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: brandie-redis
          property: connectionString # <-- 최종 정답으로 수정

  # 2. 워커 (Celery)
  - type: worker
    name: brandie-worker
    env: python
    buildCommand: 'pip install -r backend/requirements.txt'
    startCommand: 'celery -A backend.celery_worker worker --loglevel=info'
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: brandie-redis
          property: connectionString # <-- 최종 정답으로 수정
