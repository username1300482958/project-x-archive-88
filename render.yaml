services:
  # 1. 웹 서버 (FastAPI)
  - type: web
    name: brandie-web # <-- 이름을 다시 원래대로
    env: python
    plan: free
    buildCommand: 'pip install -r backend/requirements.txt'
    startCommand: 'gunicorn -w 4 -k uvicorn.workers.UvicornWorker --timeout 240 backend.main:app'
    envVars:
      - key: DATABASE_URL
        sync: false # <-- 이 값을 외부(Render 대시보드)에서 설정하겠다는 의미
      - key: REDIS_URL # <-- Redis 연결은 그대로 유지
        fromService:
          type: redis
          name: brandie-redis
          property: connectionString
